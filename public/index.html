<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>moviebot</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 16px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        background: Canvas;
        color: CanvasText;
      }
      main { max-width: 32rem; padding: 2rem; }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 0.75rem; opacity: 0.75; }
      code { opacity: 1; }
    </style>
  </head>
  <body>
    <main>
      <h1>moviebot</h1>
      <p>Discord alert bot for Cineplex Bangladesh ticket availability.</p>
      <p>
        Polling runs as a self-chaining function at <code>/api/poll</code>, which
        requires a bearer token. There is nothing to see here.
      </p>
    </main>
  </body>
</html>
